syntax = "proto3";

package rowles.leancorpus.server.v1;

option csharp_namespace = "Rowles.LeanCorpus.Server.Grpc.Contracts";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

message ResponseMetadata { string request_id = 1; string api_version = 2; string observed_utc = 3; }
message ContractFailure { string code = 1; string message = 2; bool retryable = 3; google.protobuf.Struct details = 4; }
message IndexSummary { string index_name = 1; string index_id = 2; string schema_hash = 3; int64 document_count = 4; string created_utc = 5; }
message ListIndexesResponse { ResponseMetadata metadata = 1; repeated IndexSummary indices = 2; ContractFailure failure = 3; }

message CreateIndexRequest {
  string index_name = 1;
  google.protobuf.Struct schema = 2;
  int32 shard_count = 3;
  int32 replica_count = 4;
  google.protobuf.Struct settings = 5;
}
message IndexMutationResponse { ResponseMetadata metadata = 1; IndexSummary index = 2; ContractFailure failure = 3; }
message DeleteIndexRequest { string index_name = 1; string confirmation_token = 2; }
message DeleteIndexResponse { ResponseMetadata metadata = 1; bool deleted = 2; ContractFailure failure = 3; }
message UpdateSettingsRequest { string index_name = 1; google.protobuf.Struct settings = 2; string confirmation_token = 3; }
message RefreshIndexRequest { string index_name = 1; }
message RefreshIndexResponse { ResponseMetadata metadata = 1; string index_name = 2; int64 commit_generation = 3; ContractFailure failure = 4; }

message BulkDocumentOperation { string kind = 1; string document_id = 2; google.protobuf.Struct document = 3; string idempotency_key = 4; }
message WriteToken { int32 version = 1; string index_id = 2; int64 sequence_number = 3; optional int64 commit_generation = 4; optional int64 content_token = 5; }
message BulkDocumentsRequest { string index_name = 1; repeated BulkDocumentOperation operations = 2; bool refresh = 3; string idempotency_key = 4; string durability = 5; }
message BulkDocumentResult { string document_id = 1; bool accepted = 2; ContractFailure failure = 3; }
message BulkDocumentsResponse {
  ResponseMetadata metadata = 1;
  repeated BulkDocumentResult items = 2;
  bool acknowledged = 3;
  optional int64 commit_generation = 4;
  ContractFailure failure = 5;
  WriteToken write_token = 6;
}

message SortDefinition { string field = 1; string direction = 2; }
message FacetRange { string key = 1; optional double from = 2; optional double to = 3; }
message FacetDefinition { string name = 1; string field = 2; string kind = 3; optional int32 size = 4; repeated FacetRange ranges = 5; }
message SearchRequest {
  string index_name = 1;
  google.protobuf.Struct query = 2;
  optional int32 size = 3;
  google.protobuf.ListValue search_after = 4;
  repeated SortDefinition sort = 5;
  repeated FacetDefinition facets = 6;
  string consistency = 7;
  optional bool include_documents = 8;
  bool include_highlights = 9;
  WriteToken read_token = 10;
}
message SearchHit { string document_id = 1; float score = 2; google.protobuf.Struct document = 3; google.protobuf.ListValue sort_values = 4; }
message FacetBucket { string key = 1; int64 count = 2; }
message FacetResult { string name = 1; string completeness = 2; repeated FacetBucket buckets = 3; }
message SearchResponse {
  ResponseMetadata metadata = 1;
  repeated SearchHit hits = 2;
  int64 total_hits = 3;
  string total_hits_relation = 4;
  string scoring_model = 5;
  int32 shards_total = 6;
  int32 shards_successful = 7;
  int32 shards_failed = 8;
  int32 shards_skipped = 9;
  int64 took_milliseconds = 10;
  google.protobuf.ListValue next_search_after = 11;
  repeated FacetResult facets = 12;
  bool is_partial = 13;
  ContractFailure failure = 14;
}
message ExplainRequest { string index_name = 1; string document_id = 2; google.protobuf.Struct query = 3; }
message ExplainNode { bool is_match = 1; optional float score = 2; string description = 3; repeated ExplainNode details = 4; }
message ExplainResponse { ResponseMetadata metadata = 1; ExplainNode explanation = 2; ContractFailure failure = 3; }

message GetIndexRequest { string index_name = 1; }
message IndexSchemaResponse {
  ResponseMetadata metadata = 1;
  string index_name = 2;
  google.protobuf.Struct schema = 3;
  string schema_hash = 4;
  google.protobuf.Struct settings = 5;
  ContractFailure failure = 6;
}
message IndexStatisticsResponse {
  ResponseMetadata metadata = 1;
  string index_name = 2;
  string schema_hash = 3;
  int64 document_count = 4;
  int64 deleted_document_count = 5;
  int64 storage_bytes = 6;
  int32 segment_count = 7;
  int64 commit_generation = 8;
  ContractFailure failure = 9;
}

message InspectionRequest { string index_name = 1; string resource = 2; int32 limit = 3; map<string, string> arguments = 4; }
message InspectionResponse {
  ResponseMetadata metadata = 1;
  string resource = 2;
  google.protobuf.Value data = 3;
  bool is_truncated = 4;
  optional int64 metadata_epoch = 5;
  ContractFailure failure = 6;
}
message IndexHealthSummary {
  string index_name = 1;
  string index_id = 2;
  string mode = 3;
  int64 visible_generation = 4;
  int64 durable_generation = 5;
  int64 pending_operations = 6;
  string last_successful_commit_utc = 7;
  string last_commit_error = 8;
  int32 consecutive_commit_failures = 9;
  int32 active_snapshot_leases = 10;
  bool is_installing = 11;
  bool is_usable = 12;
  bool is_degraded = 13;
  string last_install_error = 14;
}
message HealthResponse {
  ResponseMetadata metadata = 1;
  bool is_healthy = 2;
  string status = 3;
  string observed_utc = 4;
  ContractFailure failure = 5;
  repeated IndexHealthSummary indices = 6;
  string reason = 7;
}
message ReadinessResponse { ResponseMetadata metadata = 1; bool is_ready = 2; string status = 3; string observed_utc = 4; string reason = 5; ContractFailure failure = 6; }

service SearchService {
  rpc Search (SearchRequest) returns (SearchResponse);
  rpc Explain (ExplainRequest) returns (ExplainResponse);
}
service IndexService {
  rpc ListIndexes (google.protobuf.Empty) returns (ListIndexesResponse);
  rpc CreateIndex (CreateIndexRequest) returns (IndexMutationResponse);
  rpc DeleteIndex (DeleteIndexRequest) returns (DeleteIndexResponse);
  rpc UpdateSettings (UpdateSettingsRequest) returns (IndexMutationResponse);
  rpc GetSchema (GetIndexRequest) returns (IndexSchemaResponse);
  rpc GetStatistics (GetIndexRequest) returns (IndexStatisticsResponse);
  rpc BulkDocuments (BulkDocumentsRequest) returns (BulkDocumentsResponse);
  rpc RefreshIndex (RefreshIndexRequest) returns (RefreshIndexResponse);
}
service InspectionService { rpc Inspect (InspectionRequest) returns (InspectionResponse); }
service HealthService {
  rpc GetHealth (google.protobuf.Empty) returns (HealthResponse);
  rpc GetReadiness (google.protobuf.Empty) returns (ReadinessResponse);
}
