name: Benchmark
run-name: Benchmark ${{ inputs.suite }} / ${{ inputs.strategy }} / ${{ inputs.framework }} / ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite: all, core, text, compression or a named DevOps suite (e.g. query)'
        type: string
        default: all
        required: true
      strategy:
        description: Benchmark strategy preset
        type: choice
        default: default
        options:
          - fast
          - default
          - quick-compare
          - intense
          - stress
          - exhaustive
      framework:
        description: Target framework
        type: choice
        default: net10.0
        options:
          - net10.0
          - net11.0
      runner:
        description: Hosted runner OS
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      doc_count:
        description: 'Document count override (0 uses the strategy default)'
        type: number
        default: 0
      area:
        description: 'Optional comma-separated areas (core or text suites only)'
        type: string
      group:
        description: 'Optional comma-separated groups (core or text suites only)'
        type: string
      filter:
        description: 'Optional BenchmarkDotNet filter, e.g. *TermQuery* (without area/group)'
        type: string
      corpus_only:
        description: Skip Lucene.NET comparison for Core benchmarks
        type: boolean
        default: false
      dry_run:
        description: Print the resolved commands without running benchmarks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Run benchmarks
        shell: pwsh
        env:
          BENCHMARK_SUITE: ${{ inputs.suite }}
          BENCHMARK_STRATEGY: ${{ inputs.strategy }}
          BENCHMARK_FRAMEWORK: ${{ inputs.framework }}
          BENCHMARK_DOC_COUNT: ${{ inputs.doc_count }}
          BENCHMARK_AREA: ${{ inputs.area }}
          BENCHMARK_GROUP: ${{ inputs.group }}
          BENCHMARK_FILTER: ${{ inputs.filter }}
          BENCHMARK_CORPUS_ONLY: ${{ inputs.corpus_only }}
          BENCHMARK_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $suites = Import-PowerShellDataFile './scripts/devops/config/benchmark-suites.psd1'
          if ($env:BENCHMARK_SUITE -notin @('core', 'text', 'compression') -and -not $suites.ContainsKey($env:BENCHMARK_SUITE)) {
            throw "Unknown benchmark suite '$env:BENCHMARK_SUITE'. Use pwsh ./devops.ps1 benchmark -List to list suites."
          }
          $docCount = 0
          if (-not [int]::TryParse($env:BENCHMARK_DOC_COUNT, [ref]$docCount) -or $docCount -lt 0) {
            throw 'Document count must be a non-negative 32-bit integer.'
          }
          if (($env:BENCHMARK_AREA -or $env:BENCHMARK_GROUP) -and $env:BENCHMARK_SUITE -notin @('core', 'text')) {
            throw 'Area and group selection require the core or text suite.'
          }
          if ($env:BENCHMARK_FILTER -and ($env:BENCHMARK_AREA -or $env:BENCHMARK_GROUP)) {
            throw 'A BenchmarkDotNet filter cannot be combined with area or group selection.'
          }

          $benchmarkArguments = @('benchmark', '-Suite', $env:BENCHMARK_SUITE,
            '-Strat', $env:BENCHMARK_STRATEGY, '-Framework', $env:BENCHMARK_FRAMEWORK)
          if ($docCount -gt 0) { $benchmarkArguments += @('-DocCount', $docCount.ToString()) }
          if ($env:BENCHMARK_AREA) { $benchmarkArguments += @('-Area', $env:BENCHMARK_AREA) }
          if ($env:BENCHMARK_GROUP) { $benchmarkArguments += @('-Group', $env:BENCHMARK_GROUP) }
          if ($env:BENCHMARK_CORPUS_ONLY -eq 'true') { $benchmarkArguments += '-CorpusOnly' }
          if ($env:BENCHMARK_DRY_RUN -eq 'true') { $benchmarkArguments += '-Dry' }
          if ($env:BENCHMARK_FILTER) { $benchmarkArguments += @('--', '--filter', $env:BENCHMARK_FILTER) }
          & ./devops.ps1 @benchmarkArguments
          exit $LASTEXITCODE

      - name: Upload benchmark results
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ inputs.runner }}-${{ inputs.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/benchmark/runs
          if-no-files-found: ignore
