name: Benchmark
run-name: Bounded benchmark shards / ${{ inputs.framework }} / ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      framework:
        description: Target framework
        type: choice
        default: net10.0
        options:
          - net10.0
          - net11.0
      runner:
        description: Hosted runner OS
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      plan_only:
        description: Validate and print the bounded plan without building or running benchmarks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bounded-benchmark:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Bootstrap managed DevOps host
        run: pwsh ./setup.ps1

      - name: Plan bounded case shards
        shell: pwsh
        env:
          BENCHMARK_FRAMEWORK: ${{ inputs.framework }}
        run: |
          $ErrorActionPreference = 'Stop'
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost config validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $managedHost benchmark --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $shards = @(
            @{ profile = 'leancorpus-search-v1'; cases = 'collapse-complete-leancorpus,collapse-complete-lucenenet' },
            @{ profile = 'leancorpus-search-v1'; cases = 'facet-offset-page-leancorpus,facet-offset-page-lucenenet' },
            @{ profile = 'bval-03-morelikethis-cache-boundaries-v1'; cases = 'mlt-bval03-leancorpus-fixtureprebuiltsearch,mlt-bval03-lucenenet-fixtureprebuiltsearch' },
            @{ profile = 'bval-03-morelikethis-cache-boundaries-v1'; cases = 'mlt-bval03-leancorpus-fixturecoldextraction,mlt-bval03-lucenenet-fixturecoldextraction' }
          )
          foreach ($shard in $shards) {
            & $managedHost benchmark --suite all --strat quick-compare --framework $env:BENCHMARK_FRAMEWORK `
              --dataset synthetic --profile $shard.profile --case $shard.cases --max-cases 2 --dry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build benchmark host
        if: ${{ !inputs.plan_only }}
        shell: pwsh
        env:
          BENCHMARK_FRAMEWORK: ${{ inputs.framework }}
        run: |
          $ErrorActionPreference = 'Stop'
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost build --project src/devops/Rowles.LeanCorpus.Benchmarks/Rowles.LeanCorpus.Benchmarks.csproj --framework $env:BENCHMARK_FRAMEWORK
          exit $LASTEXITCODE

      - name: Smoke one BDN case
        if: ${{ !inputs.plan_only }}
        shell: pwsh
        env:
          BENCHMARK_FRAMEWORK: ${{ inputs.framework }}
        run: |
          $ErrorActionPreference = 'Stop'
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost benchmark --suite all --strat fast --framework $env:BENCHMARK_FRAMEWORK `
            --dataset synthetic --profile leancorpus-search-v1 --case collapse-complete-leancorpus `
            --engine leancorpus --max-cases 1
          exit $LASTEXITCODE

      - name: Shard 1 - collapse top-score
        if: ${{ !inputs.plan_only }}
        continue-on-error: true
        shell: pwsh
        env:
          BENCHMARK_FRAMEWORK: ${{ inputs.framework }}
        run: |
          $ErrorActionPreference = 'Stop'
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost benchmark --suite all --strat quick-compare --framework $env:BENCHMARK_FRAMEWORK `
            --dataset synthetic --profile leancorpus-search-v1 `
            --case collapse-complete-leancorpus,collapse-complete-lucenenet --max-cases 2
          $exitCode = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "SHARD1_EXIT=$exitCode"
          exit $exitCode

      - name: Shard 2 - facet page
        if: ${{ !inputs.plan_only }}
        continue-on-error: true
        shell: pwsh
        env:
          BENCHMARK_FRAMEWORK: ${{ inputs.framework }}
        run: |
          $ErrorActionPreference = 'Stop'
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost benchmark --suite all --strat quick-compare --framework $env:BENCHMARK_FRAMEWORK `
            --dataset synthetic --profile leancorpus-search-v1 `
            --case facet-offset-page-leancorpus,facet-offset-page-lucenenet --max-cases 2
          $exitCode = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "SHARD2_EXIT=$exitCode"
          exit $exitCode

      - name: Shard 3 - MLT prebuilt search
        if: ${{ !inputs.plan_only }}
        continue-on-error: true
        shell: pwsh
        env:
          BENCHMARK_FRAMEWORK: ${{ inputs.framework }}
        run: |
          $ErrorActionPreference = 'Stop'
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost benchmark --suite all --strat quick-compare --framework $env:BENCHMARK_FRAMEWORK `
            --dataset synthetic --profile bval-03-morelikethis-cache-boundaries-v1 `
            --case mlt-bval03-leancorpus-fixtureprebuiltsearch,mlt-bval03-lucenenet-fixtureprebuiltsearch --max-cases 2
          $exitCode = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "SHARD3_EXIT=$exitCode"
          exit $exitCode

      - name: Shard 4 - MLT cold extraction
        if: ${{ !inputs.plan_only }}
        continue-on-error: true
        shell: pwsh
        env:
          BENCHMARK_FRAMEWORK: ${{ inputs.framework }}
        run: |
          $ErrorActionPreference = 'Stop'
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost benchmark --suite all --strat quick-compare --framework $env:BENCHMARK_FRAMEWORK `
            --dataset synthetic --profile bval-03-morelikethis-cache-boundaries-v1 `
            --case mlt-bval03-leancorpus-fixturecoldextraction,mlt-bval03-lucenenet-fixturecoldextraction --max-cases 2
          $exitCode = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "SHARD4_EXIT=$exitCode"
          exit $exitCode

      - name: Collect run evidence
        if: always()
        shell: pwsh
        env:
          PLAN_ONLY: ${{ inputs.plan_only }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reports = @(Get-ChildItem -Path 'artifacts/benchmark/runs' -Filter 'run-report.json' -File -Recurse -ErrorAction SilentlyContinue)
          $collected = foreach ($item in $reports) {
            [ordered]@{
              path = $item.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, '')
              report = (Get-Content -Raw $item.FullName | ConvertFrom-Json)
            }
          }
          @($collected) | ConvertTo-Json -Depth 16 | Set-Content -Path 'collected-run-reports.json' -Encoding utf8

      - name: Write qualification summary
        if: always()
        shell: pwsh
        env:
          PLAN_ONLY: ${{ inputs.plan_only }}
        run: pwsh -NoProfile -File ./scripts/devops/validation/benchmark-qualification-summary.ps1 -PlanOnly $env:PLAN_ONLY

      - name: Upload benchmark run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ inputs.runner }}-${{ inputs.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/benchmark/runs
            collected-run-reports.json
            qualification-summary.json
          if-no-files-found: ignore
