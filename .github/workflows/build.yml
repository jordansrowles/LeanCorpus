name: Build

on:
  push:
    branches: [main, '[0-9]*', 'stabilise/**']
  pull_request:
    branches: [main, '[0-9]*', 'stabilise/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stabilise/') || startsWith(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Build solution
        shell: pwsh
        run: ./devops.ps1 build
      - name: Test deterministic suites
        shell: pwsh
        env: { CHAOS_ITERATIONS: 25 }
        run: ./devops.ps1 test -Suite all -Framework '${{ matrix.framework }}' -HangTimeout 100s
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.framework }}-diagnostics
          path: artifacts/test-results
          if-no-files-found: warn

  coverage:
    needs: linux-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Collect MTP coverage
        shell: pwsh
        run: ./devops.ps1 coverage -Framework net10.0 -Clean
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: coverage-results/**/*.coverage.cobertura.*.xml
          if-no-files-found: error

  windows-tests:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Build solution
        shell: pwsh
        run: ./devops.ps1 build
      - name: Run complete Windows test suite
        shell: pwsh
        run: ./devops.ps1 test -Suite all -Framework net10.0 -HangTimeout 100s
      - name: Upload failure dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-diagnostics
          path: TestResults/**
          if-no-files-found: warn

  arm64-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Build solution
        shell: pwsh
        run: ./devops.ps1 build
      - name: Run architecture-sensitive smoke tests
        shell: pwsh
        run: |
          ./devops.ps1 test -Suite architecture -Framework net10.0
          ./devops.ps1 test -Suite core -Framework net10.0 -Area 'CodecKit,Store,Vector,Index' -Category Unit -HangTimeout 100s
          ./devops.ps1 aot -RuntimeIdentifier linux-arm64

  deploy:
    needs: [linux-tests, coverage, windows-tests, arm64-smoke]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - uses: actions/download-artifact@v7
        with:
          name: coverage-results
          path: coverage-results
      - name: Build docs
        shell: pwsh
        run: ./devops docs build -SkipBenchmarks
      - uses: actions/upload-artifact@v7
        with:
          name: leancorpus-docs-site
          path: docs/site
