name: Build

on:
  push:
    branches: [main, '[0-9]*', 'stabilise/**']
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stabilise/') || startsWith(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Build solution
        shell: pwsh
        run: ./devops.ps1 build
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.framework }}-build-diagnostics
          path: artifacts/build/runs
          if-no-files-found: error
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $projectOutputRoot = Join-Path $PWD 'artifacts/bin/Rowles.LeanCorpus.OrchardCore.Search.FunctionalTests'
          $playwrightScript = Join-Path $projectOutputRoot 'release_${{ matrix.framework }}/playwright.ps1'
          if (-not (Test-Path -LiteralPath $playwrightScript -PathType Leaf)) { throw "Generated Playwright installer is missing: $playwrightScript" }
          pwsh $playwrightScript install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate DevOps artefact infrastructure
        if: matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          pwsh ./scripts/devops/validation/artifacts-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh ./scripts/devops/validation/runtime-identifier-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh ./scripts/devops/validation/test-progress-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh ./scripts/devops/validation/affected-selection-smoke.ps1
      - name: Test deterministic suites
        shell: pwsh
        env: { CHAOS_ITERATIONS: 25 }
        run: ./devops.ps1 test all --ci --framework '${{ matrix.framework }}' --HangTimeout 100s
      - name: Upload test run artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.framework }}-test-results
          path: artifacts/test/runs
          if-no-files-found: warn

  coverage:
    needs: linux-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Collect MTP coverage
        shell: pwsh
        run: ./devops.ps1 coverage -Framework net10.0 -Clean
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-runs
          path: artifacts/coverage/runs
          if-no-files-found: error

  windows-tests:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Build solution
        shell: pwsh
        run: ./devops.ps1 build
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-diagnostics
          path: artifacts/build/runs
          if-no-files-found: error
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $projectOutputRoot = Join-Path $PWD 'artifacts/bin/Rowles.LeanCorpus.OrchardCore.Search.FunctionalTests'
          $playwrightScript = Join-Path $projectOutputRoot 'release_net11.0/playwright.ps1'
          if (-not (Test-Path -LiteralPath $playwrightScript -PathType Leaf)) { throw "Generated Playwright installer is missing: $playwrightScript" }
          pwsh $playwrightScript install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete Windows test suite
        shell: pwsh
        env:
          CHAOS_ITERATIONS: 25
        run: |
          pwsh ./scripts/devops/validation/test-progress-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./devops.ps1 test all --ci --HangTimeout 100s
      - name: Upload test run artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: artifacts/test/runs
          if-no-files-found: warn

  package-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Validate shipping package APIs and archives
        shell: pwsh
        run: ./devops.ps1 pack -Clean
      - name: Upload package validation artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-validation-artefacts
          path: artifacts/package
          if-no-files-found: error

  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Validate generated package consumers
        shell: pwsh
        run: ./devops.ps1 pack -Clean -ValidatePackages
      - name: Upload package consumer artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-consumer-artefacts
          path: |
            artifacts/package
            artifacts/test/runs
          if-no-files-found: error

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            rid: linux-x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
          - platform: windows-x64
            runner: windows-2025
            rid: win-x64
          - platform: macos-arm64
            runner: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Run platform smoke and Native AOT
        shell: pwsh
        run: |
          ./devops.ps1 test architecture --framework net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./devops.ps1 test core --framework net10.0 --Filter 'Scope=PlatformSmoke' --HangTimeout 100s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./devops.ps1 aot --ci --framework net10.0 --RuntimeIdentifier '${{ matrix.rid }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test run artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.platform }}
          path: artifacts/test/runs
          if-no-files-found: warn

  deploy:
    needs: [linux-tests, coverage, windows-tests, platform-smoke]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - uses: actions/download-artifact@v7
        with:
          name: coverage-runs
          path: artifacts/coverage/runs
      - name: Build docs
        shell: pwsh
        run: ./devops docs build -SkipBenchmarks
      - uses: actions/upload-artifact@v7
        with:
          name: leancorpus-docs-site
          path: artifacts/docs/site
