name: Build

on:
  push:
    branches: [main, '[0-9]*']
  pull_request:
    branches: [main, '[0-9]*']
jobs:
  build:
    if: |
      github.event_name == 'pull_request' ||
      startsWith(github.event.head_commit.message, '[build]') ||
      startsWith(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore tests
        run: |
          dotnet restore src/core/Rowles.Text/Rowles.Text.csproj
          dotnet restore src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj
          dotnet restore src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj
          dotnet restore src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj
          dotnet restore src/devops/Rowles.LeanCorpus.Tests.AOTSmoke/Rowles.LeanCorpus.Tests.AOTSmoke.csproj
          dotnet restore src/server/devops/Rowles.LeanCorpus.Server.Abstractions.Tests/Rowles.LeanCorpus.Server.Abstractions.Tests.csproj
          dotnet restore src/server/devops/Rowles.LeanCorpus.Server.Core.Tests/Rowles.LeanCorpus.Server.Core.Tests.csproj
          dotnet restore src/server/devops/Rowles.LeanCorpus.Server.Integration.Tests/Rowles.LeanCorpus.Server.Integration.Tests.csproj

      - name: Restore architecture tests
        run: dotnet restore src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj

      - name: Build tests
        run: |
          dotnet build src/core/Rowles.Text/Rowles.Text.csproj -c Release --no-restore
          dotnet build src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj -c Release --no-restore
          dotnet build src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj -c Release --no-restore
          dotnet build src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj -c Release --no-restore
          dotnet build src/devops/Rowles.LeanCorpus.Tests.AOTSmoke/Rowles.LeanCorpus.Tests.AOTSmoke.csproj -c Release --no-restore
          dotnet build src/server/devops/Rowles.LeanCorpus.Server.Abstractions.Tests/Rowles.LeanCorpus.Server.Abstractions.Tests.csproj -c Release --no-restore
          dotnet build src/server/devops/Rowles.LeanCorpus.Server.Core.Tests/Rowles.LeanCorpus.Server.Core.Tests.csproj -c Release --no-restore
          dotnet build src/server/devops/Rowles.LeanCorpus.Server.Integration.Tests/Rowles.LeanCorpus.Server.Integration.Tests.csproj -c Release --no-restore

      - name: Pack Rowles.Text
        run: dotnet pack src/core/Rowles.Text/Rowles.Text.csproj -c Release --no-build

      - name: Upload Rowles.Text package
        uses: actions/upload-artifact@v7
        with:
          name: rowles-text-package
          path: src/core/Rowles.Text/bin/Release/*.nupkg

      - name: Build architecture tests
        run: dotnet build src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj -c Release --no-build --logger "trx;LogFileName=rowles-text-test-results.trx"
          CHAOS_ITERATIONS=1000 dotnet test src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj -c Release --no-build --logger "trx;LogFileName=core-test-results.trx" --collect "XPlat Code Coverage" --results-directory coverage-results
          dotnet test src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj -c Release --no-build --logger "trx;LogFileName=sourcegen-test-results.trx" --collect "XPlat Code Coverage" --results-directory coverage-results
          dotnet test src/server/devops/Rowles.LeanCorpus.Server.Abstractions.Tests/Rowles.LeanCorpus.Server.Abstractions.Tests.csproj -c Release --no-build --logger "trx;LogFileName=server-abstractions-test-results.trx"
          dotnet test src/server/devops/Rowles.LeanCorpus.Server.Core.Tests/Rowles.LeanCorpus.Server.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=server-core-test-results.trx"
          dotnet test src/server/devops/Rowles.LeanCorpus.Server.Integration.Tests/Rowles.LeanCorpus.Server.Integration.Tests.csproj -c Release --no-build --logger "trx;LogFileName=server-integration-test-results.trx"

      - name: Test architecture rules
        run: |
          dotnet test src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj -c Release -f net10.0 --no-build --logger "trx;LogFileName=architecture-net10-test-results.trx" --results-directory architecture-test-results/net10.0
          dotnet test src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj -c Release -f net11.0 --no-build --logger "trx;LogFileName=architecture-net11-test-results.trx" --results-directory architecture-test-results/net11.0

      - name: Run Native AOT smoke tests
        run: ./devops aot

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            src/devops/Rowles.Text.Tests/TestResults/*.trx
            src/devops/Rowles.LeanCorpus.Tests.Core/TestResults/*.trx
            src/devops/Rowles.LeanCorpus.Tests.SourceGen/TestResults/*.trx
            src/server/devops/Rowles.LeanCorpus.Server.Abstractions.Tests/TestResults/*.trx
            src/server/devops/Rowles.LeanCorpus.Server.Core.Tests/TestResults/*.trx
            src/server/devops/Rowles.LeanCorpus.Server.Integration.Tests/TestResults/*.trx
            architecture-test-results/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: coverage-results/**/coverage.cobertura.xml
          if-no-files-found: ignore

  windows-build:
    if: |
      github.event_name == 'pull_request' ||
      startsWith(github.event.head_commit.message, '[build]') ||
      startsWith(github.event.head_commit.message, '[deploy]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore tests
        run: |
          dotnet restore src/core/Rowles.Text/Rowles.Text.csproj
          dotnet restore src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj
          dotnet restore src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj
          dotnet restore src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj
          dotnet restore src/devops/Rowles.LeanCorpus.Tests.AOTSmoke/Rowles.LeanCorpus.Tests.AOTSmoke.csproj
          dotnet restore src/server/devops/Rowles.LeanCorpus.Server.Abstractions.Tests/Rowles.LeanCorpus.Server.Abstractions.Tests.csproj
          dotnet restore src/server/devops/Rowles.LeanCorpus.Server.Core.Tests/Rowles.LeanCorpus.Server.Core.Tests.csproj
          dotnet restore src/server/devops/Rowles.LeanCorpus.Server.Integration.Tests/Rowles.LeanCorpus.Server.Integration.Tests.csproj

      - name: Restore architecture tests
        run: dotnet restore src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj

      - name: Build tests
        run: |
          dotnet build src/core/Rowles.Text/Rowles.Text.csproj -c Release --no-restore
          dotnet build src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj -c Release --no-restore
          dotnet build src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj -c Release --no-restore
          dotnet build src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj -c Release --no-restore
          dotnet build src/devops/Rowles.LeanCorpus.Tests.AOTSmoke/Rowles.LeanCorpus.Tests.AOTSmoke.csproj -c Release --no-restore
          dotnet build src/server/devops/Rowles.LeanCorpus.Server.Abstractions.Tests/Rowles.LeanCorpus.Server.Abstractions.Tests.csproj -c Release --no-restore
          dotnet build src/server/devops/Rowles.LeanCorpus.Server.Core.Tests/Rowles.LeanCorpus.Server.Core.Tests.csproj -c Release --no-restore
          dotnet build src/server/devops/Rowles.LeanCorpus.Server.Integration.Tests/Rowles.LeanCorpus.Server.Integration.Tests.csproj -c Release --no-restore

      - name: Build architecture tests
        run: dotnet build src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj -c Release --no-build --logger "trx;LogFileName=rowles-text-test-results.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CHAOS_ITERATIONS = "1000"; dotnet test src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj -c Release --no-build --logger "trx;LogFileName=core-test-results.trx" --collect "XPlat Code Coverage" --results-directory coverage-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj -c Release --no-build --logger "trx;LogFileName=sourcegen-test-results.trx" --collect "XPlat Code Coverage" --results-directory coverage-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test src/server/devops/Rowles.LeanCorpus.Server.Abstractions.Tests/Rowles.LeanCorpus.Server.Abstractions.Tests.csproj -c Release --no-build --logger "trx;LogFileName=server-abstractions-test-results.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test src/server/devops/Rowles.LeanCorpus.Server.Core.Tests/Rowles.LeanCorpus.Server.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=server-core-test-results.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test src/server/devops/Rowles.LeanCorpus.Server.Integration.Tests/Rowles.LeanCorpus.Server.Integration.Tests.csproj -c Release --no-build --logger "trx;LogFileName=server-integration-test-results.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test architecture rules
        run: |
          dotnet test src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj -c Release -f net10.0 --no-build --logger "trx;LogFileName=architecture-net10-test-results.trx" --results-directory architecture-test-results/net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj -c Release -f net11.0 --no-build --logger "trx;LogFileName=architecture-net11-test-results.trx" --results-directory architecture-test-results/net11.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Native AOT smoke tests
        run: .\devops.ps1 aot

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: |
            src/devops/Rowles.Text.Tests/TestResults/*.trx
            src/devops/Rowles.LeanCorpus.Tests.Core/TestResults/*.trx
            src/devops/Rowles.LeanCorpus.Tests.SourceGen/TestResults/*.trx
            src/server/devops/Rowles.LeanCorpus.Server.Abstractions.Tests/TestResults/*.trx
            src/server/devops/Rowles.LeanCorpus.Server.Core.Tests/TestResults/*.trx
            src/server/devops/Rowles.LeanCorpus.Server.Integration.Tests/TestResults/*.trx
            architecture-test-results/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results-windows
          path: coverage-results/**/coverage.cobertura.xml
          if-no-files-found: ignore

  deploy:
    needs: build
    if: startsWith(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Download coverage results
        uses: actions/download-artifact@v7
        with:
          name: coverage-results
          path: coverage-results

      - name: Restore core library
        run: dotnet restore src/core/Rowles.LeanCorpus/Rowles.LeanCorpus.csproj

      - name: Build core library
        run: dotnet build src/core/Rowles.LeanCorpus/Rowles.LeanCorpus.csproj -c Release --no-restore

      - name: Build docs
        shell: pwsh
        run: ./devops docs build -SkipBenchmarks


      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: leancorpus-docs-site
          path: docs/site
