name: Build

on:
  push:
    branches: [main, '[0-9]*', 'stabilise/**']
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  managed-devops-foundation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: win-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Exercise managed bootstrap failure and rollback contracts
        if: matrix.platform == 'linux-x64'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/devops/validation/managed-bootstrap-smoke.ps1
      - name: Bootstrap and qualify managed DevOps host
        shell: pwsh
        run: pwsh -NoProfile -File ./setup.ps1
      - name: Verify promoted host, direct build and PowerShell forwarding
        shell: pwsh
        run: |
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $managedHost --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $project = 'src/devops/Rowles.LeanCorpus.DevOps.ProcessTestChild/Rowles.LeanCorpus.DevOps.ProcessTestChild.csproj'
          & $managedHost build --project $project --framework net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh ./devops.ps1 build --project $project --framework net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run report all through the promoted host
        shell: pwsh
        run: |
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          $reportOutputPath = Join-Path $env:RUNNER_TEMP 'managed-report-all.stdout.json'
          & $managedHost report all --json > $reportOutputPath
          $reportExitCode = $LASTEXITCODE
          if ($reportExitCode -ne 0) {
            Get-Content -LiteralPath $reportOutputPath
            exit $reportExitCode
          }
          $report = Get-Content -LiteralPath $reportOutputPath -Raw | ConvertFrom-Json -Depth 100
          if ($report.contractVersion -ne 1 -or
              $report.command -cne 'report' -or
              $report.requestSummary.group -cne 'all' -or
              $report.state -cne 'succeeded' -or
              $report.outcome -cne 'Success' -or
              [string]::IsNullOrWhiteSpace($report.runId) -or
              @($report.childAttempts).Count -eq 0) {
            throw 'Managed report all returned an incomplete or unsuccessful JSON contract.'
          }
          $reportArtifactPath = Join-Path $PWD "artifacts/report/runs/$($report.runId)/report.json"
          if (-not (Test-Path -LiteralPath $reportArtifactPath -PathType Leaf)) {
            throw "Managed report run artifact is missing: $reportArtifactPath"
          }
          Write-Host "Managed report run $($report.runId) succeeded with $(@($report.childAttempts).Count) child commands."
      - name: Upload managed report evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-report-${{ matrix.platform }}
          path: artifacts/report/runs
          if-no-files-found: warn
      - name: Upload managed DevOps diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: managed-devops-${{ matrix.platform }}-diagnostics
          path: |
            artifacts/devops
            artifacts/build/runs
          if-no-files-found: warn

  linux-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stabilise/') || startsWith(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Bootstrap managed DevOps host
        shell: pwsh
        run: pwsh -NoProfile -File ./setup.ps1
      - name: Build solution
        shell: pwsh
        run: |
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.framework }}-build-diagnostics
          path: artifacts/build/runs
          if-no-files-found: warn
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $projectOutputRoot = Join-Path $PWD 'artifacts/bin/Rowles.LeanCorpus.OrchardCore.Search.FunctionalTests'
          $playwrightScript = Join-Path $projectOutputRoot 'release_${{ matrix.framework }}/playwright.ps1'
          if (-not (Test-Path -LiteralPath $playwrightScript -PathType Leaf)) { throw "Generated Playwright installer is missing: $playwrightScript" }
          pwsh $playwrightScript install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate DevOps artefact infrastructure
        if: matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          pwsh ./scripts/devops/validation/artifacts-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh ./scripts/devops/validation/test-selection-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh ./scripts/devops/validation/runtime-identifier-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh ./scripts/devops/validation/test-progress-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh ./scripts/devops/validation/affected-selection-smoke.ps1
      - name: Test deterministic suites
        shell: pwsh
        env: { CHAOS_ITERATIONS: 25 }
        run: ./devops.ps1 test all --ci --framework '${{ matrix.framework }}' --HangTimeout 100s
      - name: Upload test run artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.framework }}-test-results
          path: artifacts/test/runs
          if-no-files-found: warn

  coverage:
    needs: linux-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Bootstrap managed DevOps host
        shell: pwsh
        run: pwsh -NoProfile -File ./setup.ps1
      - name: Collect MTP coverage
        shell: pwsh
        run: ./devops coverage --framework net10.0 --clean
      - name: Upload coverage run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-runs
          path: artifacts/coverage/runs
          if-no-files-found: warn
      - name: Upload linked coverage test-run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-runs
          path: artifacts/test/runs
          if-no-files-found: warn

  windows-tests:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Bootstrap managed DevOps host
        shell: pwsh
        run: pwsh -NoProfile -File ./setup.ps1
      - name: Build solution
        shell: pwsh
        run: |
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-diagnostics
          path: artifacts/build/runs
          if-no-files-found: warn
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $projectOutputRoot = Join-Path $PWD 'artifacts/bin/Rowles.LeanCorpus.OrchardCore.Search.FunctionalTests'
          $playwrightScript = Join-Path $projectOutputRoot 'release_net11.0/playwright.ps1'
          if (-not (Test-Path -LiteralPath $playwrightScript -PathType Leaf)) { throw "Generated Playwright installer is missing: $playwrightScript" }
          pwsh $playwrightScript install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete Windows test suite
        shell: pwsh
        env:
          CHAOS_ITERATIONS: 25
        run: |
          pwsh ./scripts/devops/validation/test-progress-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./devops.ps1 test all --ci --HangTimeout 100s
      - name: Upload test run artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: artifacts/test/runs
          if-no-files-found: warn

  package-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Bootstrap managed DevOps host
        shell: pwsh
        run: pwsh -NoProfile -File ./setup.ps1
      - name: Validate shipping package APIs and archives
        shell: pwsh
        run: |
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost pack --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload package validation artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-validation-artefacts
          path: artifacts/package
          if-no-files-found: error

  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Bootstrap managed DevOps host
        shell: pwsh
        run: pwsh -NoProfile -File ./setup.ps1
      - name: Validate generated package consumers
        shell: pwsh
        run: |
          $managedHost = if ($IsWindows) { './devops.exe' } else { './devops' }
          & $managedHost pack --clean --validate-packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload package consumer artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-consumer-artefacts
          path: |
            artifacts/package
            artifacts/test/runs
          if-no-files-found: error

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            rid: linux-x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
          - platform: windows-x64
            runner: windows-2025
            rid: win-x64
          - platform: macos-arm64
            runner: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Run platform smoke and Native AOT
        shell: pwsh
        run: |
          ./devops.ps1 test architecture --framework net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./devops.ps1 test core --framework net10.0 --Filter 'Scope=PlatformSmoke' --HangTimeout 100s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./devops.ps1 aot --ci --framework net10.0 --RuntimeIdentifier '${{ matrix.rid }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test run artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.platform }}
          path: artifacts/test/runs
          if-no-files-found: warn

  docs-site:
    needs: [linux-tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: docs/site-config/diagrams/package-lock.json
      - name: Validate docs deployment admission rules
        run: node scripts/devops/validation/resolve-docs-deployment-run.test.mjs
      - name: Restore repository tools
        shell: pwsh
        run: ./setup.ps1
      - uses: actions/download-artifact@v7
        with:
          name: coverage-runs
          path: artifacts/coverage/runs
      - name: Build docs test target
        shell: pwsh
        run: ./devops build --project src/devops/Rowles.LeanCorpus.Tests.Docs/Rowles.LeanCorpus.Tests.Docs.csproj --framework net10.0
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $playwrightScript = Join-Path $PWD 'artifacts/bin/Rowles.LeanCorpus.Tests.Docs/release_net10.0/playwright.ps1'
          if (-not (Test-Path -LiteralPath $playwrightScript -PathType Leaf)) { throw "Generated Playwright installer is missing: $playwrightScript" }
          pwsh $playwrightScript install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build documentation site
        shell: pwsh
        run: ./devops docs build
      - name: Validate documentation site
        shell: pwsh
        run: ./devops docs test --framework net10.0 --no-restore
      - uses: actions/upload-artifact@v7
        with:
          name: leancorpus-docs-site
          path: |
            artifacts/docs/site
            artifacts/docs/generated/provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-diagnostics
          path: artifacts/docs/diagnostics
          if-no-files-found: warn
      - name: Upload documentation validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-validation
          path: |
            artifacts/docs/runs
            artifacts/test/runs
            artifacts/build/runs
          if-no-files-found: warn
          retention-days: 30
