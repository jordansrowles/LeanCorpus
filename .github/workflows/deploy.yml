name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build workflow run ID with a validated docs-site artefact
        required: true
        type: string

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Resolve successful Build run
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.id
              : Number(context.payload.inputs.run_id);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              throw new Error('run_id must be a positive Build workflow run ID.');
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.name !== 'Build' || run.conclusion !== 'success') {
              throw new Error(`Run ${runId} is not a successful Build workflow run.`);
            }
            if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error(`Run ${runId} was produced by a different repository.`);
            }
            if (!/^[A-Za-z0-9._/-]+$/.test(run.head_branch)) {
              throw new Error(`Build branch is not a safe Cloudflare branch name: ${run.head_branch}`);
            }

            core.setOutput('run-id', String(run.id));
            core.setOutput('head-sha', run.head_sha);
            core.setOutput('branch', run.head_branch);
            core.setOutput('run-number', String(run.run_number));
      - name: Download validated documentation artefact
        uses: actions/download-artifact@v8
        with:
          name: leancorpus-docs-site
          path: docs-site
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artefact revision
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.head-sha }}
        run: |
          $provenancePath = Join-Path $PWD 'docs-site/generated/provenance.json'
          $sitePath = Join-Path $PWD 'docs-site/site'
          if (-not (Test-Path -LiteralPath $provenancePath -PathType Leaf)) { throw 'The docs artefact has no provenance manifest.' }
          if (-not (Test-Path -LiteralPath (Join-Path $sitePath 'index.html') -PathType Leaf)) { throw 'The docs artefact has no generated site.' }
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          if ($provenance.commit -ne $env:EXPECTED_COMMIT) { throw "Docs artefact commit '$($provenance.commit)' does not match Build commit '$env:EXPECTED_COMMIT'." }
          Write-Host "Verified Build run ${{ steps.source.outputs.run-number }} at $($provenance.commit)."
      - name: Deploy validated site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/site --project-name=leanlucene --branch=${{ steps.source.outputs.branch }} --commit-dirty=true
