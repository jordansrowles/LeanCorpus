name: Detect flaky tests

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of times to run each test suite
        required: true
        default: 5
        type: number
  push:

jobs:
  detect-flaky:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, '[detect-flakey]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Restore test projects
        shell: pwsh
        run: |
          $projects = @(
            'src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj'
            'src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj'
            'src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj'
            'src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj'
            'src/devops/Rowles.LeanCorpus.Tests.AOTSmoke/Rowles.LeanCorpus.Tests.AOTSmoke.csproj'
          )

          foreach ($project in $projects) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Build test projects
        shell: pwsh
        run: |
          $projects = @(
            'src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj'
            'src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj'
            'src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj'
            'src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj'
            'src/devops/Rowles.LeanCorpus.Tests.AOTSmoke/Rowles.LeanCorpus.Tests.AOTSmoke.csproj'
          )

          foreach ($project in $projects) {
            dotnet build $project -c Release --no-restore
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Repeat tests
        shell: pwsh
        env:
          REPETITIONS: ${{ inputs.repetitions || 5 }}
          CHAOS_ITERATIONS: 1000
        run: |
          $suites = @(
            @{ Name = 'text'; Project = 'src/devops/Rowles.Text.Tests/Rowles.Text.Tests.csproj' }
            @{ Name = 'core'; Project = 'src/devops/Rowles.LeanCorpus.Tests.Core/Rowles.LeanCorpus.Tests.Core.csproj' }
            @{ Name = 'sourcegen'; Project = 'src/devops/Rowles.LeanCorpus.Tests.SourceGen/Rowles.LeanCorpus.Tests.SourceGen.csproj' }
            @{ Name = 'architecture'; Project = 'src/devops/Rowles.LeanCorpus.Tests.Architecture/Rowles.LeanCorpus.Tests.Architecture.csproj' }
          )
          $frameworks = @('net10.0', 'net11.0')
          $failed = $false
          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add('| Repetition | OS | Suite | Framework | Result |')
          $summary.Add('| ---: | --- | --- | --- | --- |')

          for ($iteration = 1; $iteration -le [int]$env:REPETITIONS; $iteration++) {
            foreach ($suite in $suites) {
              foreach ($framework in $frameworks) {
                $resultDirectory = "flaky-test-results/$iteration/$($suite.Name)/$framework"
                dotnet test $suite.Project -c Release -f $framework --no-build `
                  --logger "trx;LogFileName=$($suite.Name).trx" `
                  --results-directory $resultDirectory
                $passed = $LASTEXITCODE -eq 0
                $result = if ($passed) { 'Passed' } else { 'Failed' }
                $summary.Add("| $iteration | ${{ matrix.os }} | $($suite.Name) | $framework | $result |")
                if (-not $passed) {
                  $failed = $true
                }
              }
            }

            $aotDirectory = "flaky-test-results/$iteration/aot-smoke/net10.0"
            New-Item -ItemType Directory -Force -Path $aotDirectory | Out-Null
            dotnet run `
              --project src/devops/Rowles.LeanCorpus.Tests.AOTSmoke/Rowles.LeanCorpus.Tests.AOTSmoke.csproj `
              -c Release --no-build --framework net10.0 *>&1 |
              Tee-Object -FilePath "$aotDirectory/aot-smoke.log"
            $aotPassed = $LASTEXITCODE -eq 0
            $aotResult = if ($aotPassed) { 'Passed' } else { 'Failed' }
            $summary.Add("| $iteration | ${{ matrix.os }} | aot-smoke | net10.0 | $aotResult |")
            if (-not $aotPassed) {
              $failed = $true
            }
          }

          $summary | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($failed) {
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-results-${{ matrix.os }}
          path: flaky-test-results
          if-no-files-found: warn
