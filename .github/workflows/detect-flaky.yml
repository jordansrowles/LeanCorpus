name: Detect flaky tests

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of times to run each resolved test target
        required: true
        default: 5
        type: number
  push:

jobs:
  detect-flaky:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, '[detect-flaky]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Build prepared test output
        shell: pwsh
        run: ./devops.ps1 build

      - name: Run repeated test pipeline
        shell: pwsh
        env:
          CHAOS_ITERATIONS: 1000
        run: ./devops.ps1 test all --ci --flaky --count '${{ inputs.repetitions || 5 }}'

      - name: Upload test run artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-runs-${{ matrix.os }}
          path: artifacts/test/runs
          if-no-files-found: warn
